# Render blueprint for the backend (Railway works too: same start command).
services:
  - type: web
    name: homework-lamp-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: CORS_ORIGINS
        sync: false
      - key: SAMPLES_DIR
        value: /opt/render/project/src/test-worksheets
